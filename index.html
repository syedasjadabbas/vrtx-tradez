    <style>
      /* Splash screen: inline so it paints before the app's CSS and JS load */
      html.splash-on { overflow: hidden; }
      #splash { position: fixed; inset: 0; z-index: 1000; display: grid; place-items: center; background: #0a0a0b;
        transition: opacity .6s cubic-bezier(.22,1,.36,1), visibility .6s; }
      #splash::before { content: ''; position: absolute; width: 640px; height: 640px; left: 50%; top: 50%; transform: translate(-50%, -50%);
        background: radial-gradient(closest-side, rgba(95,150,255,.16), transparent 70%); pointer-events: none; }
      #splash.done { opacity: 0; visibility: hidden; }
      #splash.done .sp-inner { transform: scale(.97); }
      .sp-inner { position: relative; display: flex; flex-direction: column; align-items: center; gap: 28px; transition: transform .6s cubic-bezier(.22,1,.36,1); }
      .sp-logo { width: 56px; height: 56px; border-radius: 15px; box-shadow: 0 0 40px rgba(95,150,255,.25); animation: sp-fade .6s ease both; }
      .sp-chart { position: relative; width: 196px; height: 110px; }
      .sp-c { position: absolute; bottom: var(--b); left: calc(var(--i) * 14px); width: 8px; height: var(--h); border-radius: 2px;
        background: #4a4a52; transform-origin: 50% 100%; opacity: 0;
        animation: sp-grow .42s cubic-bezier(.22,1,.36,1) forwards; animation-delay: calc(.1s + var(--i) * 55ms); }
      .sp-c::before { content: ''; position: absolute; left: 50%; top: -5px; bottom: -5px; width: 1.5px; transform: translateX(-50%); background: inherit; z-index: -1; }
      .sp-c.up { background: #e9e9ea; }
      .sp-c.last { background: #5f96ff; box-shadow: 0 0 16px rgba(95,150,255,.8); }
      .sp-bar { width: 160px; height: 2px; border-radius: 2px; background: rgba(255,255,255,.08); overflow: hidden; }
      .sp-bar span { display: block; height: 100%; background: #5f96ff; transform-origin: left; animation: sp-load 1.4s cubic-bezier(.65,0,.35,1) forwards; }
      .sp-word { font: 600 13px/1 Inter, system-ui, sans-serif; letter-spacing: .5em; margin-right: -.5em; color: #8b8b92; animation: sp-fade .6s ease .2s both; }
      @keyframes sp-grow { from { opacity: 0; transform: scaleY(.15); } to { opacity: 1; transform: none; } }
      @keyframes sp-load { from { transform: scaleX(0); } to { transform: scaleX(1); } }
      @keyframes sp-fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
      @media (prefers-reduced-motion: reduce) { .sp-c, .sp-bar span, .sp-logo, .sp-word { animation: none; opacity: 1; transform: none; } }
    </style>
